<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-weight="700" font-size="16">How the two layers meet: the artifact boundary</text>

  <!-- Layer 2 -->
  <rect x="60" y="48" width="640" height="96" rx="10" fill="#e6f4ea" stroke="#2e7d4f"/>
  <text x="380" y="84" text-anchor="middle" font-weight="700" font-size="15">Layer 2 &#8212; the workflow pack (skills)</text>
  <text x="380" y="110" text-anchor="middle" font-size="13" fill="#444">does the work, then leaves signals behind</text>
  <text x="380" y="130" text-anchor="middle" font-size="12.5" fill="#2e7d4f" font-weight="600">WRITES &#8595;</text>

  <!-- write arrows -->
  <line x1="230" y1="146" x2="230" y2="204" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="530" y1="146" x2="530" y2="204" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- boundary line + artifacts -->
  <line x1="40" y1="258" x2="720" y2="258" stroke="#b8860b" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="380" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#b8860b">the artifact boundary</text>

  <rect x="70" y="236" width="180" height="44" rx="8" fill="#fff4d6" stroke="#b8860b"/>
  <text x="160" y="263" text-anchor="middle" font-size="12.5">Linear issue state</text>

  <rect x="290" y="236" width="180" height="44" rx="8" fill="#fff4d6" stroke="#b8860b"/>
  <text x="380" y="263" text-anchor="middle" font-size="12.5">run-log fields</text>

  <rect x="510" y="236" width="180" height="44" rx="8" fill="#fff4d6" stroke="#b8860b"/>
  <text x="600" y="258" text-anchor="middle" font-size="11.5">.drain-handoff.json</text>
  <text x="600" y="273" text-anchor="middle" font-size="11" fill="#666">(pr_urls)</text>

  <!-- read arrows -->
  <line x1="230" y1="282" x2="230" y2="340" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="530" y1="282" x2="530" y2="340" stroke="#444" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Layer 1 -->
  <rect x="60" y="344" width="640" height="96" rx="10" fill="#e8f0fe" stroke="#3b6fb5"/>
  <text x="380" y="364" text-anchor="middle" font-size="12.5" fill="#3b6fb5" font-weight="600">READS &#8595;</text>
  <text x="380" y="392" text-anchor="middle" font-weight="700" font-size="15">Layer 1 &#8212; the supervisor</text>
  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#444">advances to the next issue, or halts, on whether an artifact exists</text>

  <!-- note -->
  <text x="380" y="472" text-anchor="middle" font-size="12.5" fill="#555">Layer 1 never reads the workflow&#8217;s steps &#8212; only the artifacts it leaves behind.</text>
  <text x="380" y="492" text-anchor="middle" font-size="12.5" fill="#555">That content-blindness is what lets the same Layer 2 run under any worker.</text>
</svg>
